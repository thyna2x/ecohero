<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoHero – Boas Ações</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
  html, body { width:100%; height:100%; overflow:hidden; background: linear-gradient(to top, #a8e6cf, #dcedc1); }

  /* LOGIN */
  #loginPage { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; z-index:2; }
  #loginCard { position:relative; z-index:2; background:rgba(255,255,255,0.95); padding:30px 40px; border-radius:20px; box-shadow:0 15px 40px rgba(0,0,0,0.3); text-align:center; animation:float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
  #loginCard h1 { color:#2e7d32; margin-bottom:10px; font-size:2em; }
  #loginCard p { margin-bottom:20px; color:#4caf50; font-weight:bold; animation:fadeIn 2s ease; }
  @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }
  #username { padding:12px; width:100%; border-radius:10px; border:2px solid #4caf50; margin-bottom:15px; font-size:1em; transition:0.3s; }
  #username:focus { border-color:#66bb6a; box-shadow:0 0 10px rgba(102,187,106,0.6); outline:none; }
  #loginBtn { padding:12px 20px; width:100%; border:none; border-radius:10px; background:#4caf50; color:white; font-weight:bold; cursor:pointer; font-size:1em; transition:0.3s; }
  #loginBtn:hover { background:#43a047; transform:scale(1.05); }
  #mascote { font-size:3em; margin-bottom:10px; animation:bounce 2s infinite; }
  @keyframes bounce { 0%,100%{ transform:translateY(0);}50%{ transform:translateY(-15px);} }

  /* APP */
  #appPage { display:none; max-width:500px; width:95%; background: rgba(255,255,255,0.95); border-radius:20px; padding:20px; box-shadow:0 8px 20px rgba(0,0,0,0.2); position:relative; z-index:1; margin:20px auto; }
  h1,h2,h3 { text-align:center; color:#2e7d32; }
  .points-bar { background:#ddd; border-radius:20px; overflow:hidden; height:20px; margin:10px 0;}
  .points-fill { height:100%; background:#4caf50; width:0%; text-align:center; color:white; line-height:20px; transition:width 0.5s;}
  .menu { display:flex; justify-content:space-around; margin:10px 0; }
  .menu button { flex:1; margin:0 5px; padding:10px; border:none; border-radius:10px; background:#81c784; color:white; cursor:pointer; transition:0.2s;}
  .menu button.active { background:#4caf50; font-weight:bold; }
  .menu button:hover{ background:#66bb6a; }
  .action-card { background:#e8f5e9; border-radius:15px; margin:10px 0; padding:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1); cursor:pointer; position:relative; transition:0.2s; font-size:1.1em; display:flex; align-items:center; }
  .action-card:hover { transform:scale(1.05); box-shadow:0 6px 14px rgba(0,0,0,0.2); }
  .action-card span.emoji { font-size:2em; margin-right:10px; }
  .action-page { display:none; }
  #badge { display:none; text-align:center; font-size:1.5em; color:gold; font-weight:bold; animation:pop 0.5s ease; margin:10px 0;}
  @keyframes pop {0%{transform:scale(0);}100%{transform:scale(1);}}
  .float-points { position:absolute; font-weight:bold; color:#4caf50; animation:floatUp 1s ease forwards; }
  @keyframes floatUp {0%{transform:translateY(0); opacity:1;}100%{transform:translateY(-40px); opacity:0;}}
  #rewards p { display:flex; justify-content:space-between; align-items:center; margin:10px 10px; padding:5px 0; border-bottom:1px solid #c8e6c9; }
  #rewards span { flex:1; }
  #rewards button { background:#4caf50; padding:5px 10px; border-radius:5px; transition:0.2s; }
  #rewards button:hover { background:#45a049; }
  #userTree { width:100px; height:150px; margin:10px auto; background:url('https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Tree_icon.svg/1024px-Tree_icon.svg.png') no-repeat center bottom; background-size:contain; transition:transform 0.5s; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div id="loginCard">
    <div id="mascote">🌳</div>
    <h1>EcoHero</h1>
    <p>Bem-vindo(a)! Vamos salvar o planeta juntos!</p>
    <input type="text" id="username" placeholder="Digite seu nome">
    <button id="loginBtn">Entrar / Cadastrar</button>
  </div>
</div>

<!-- APP -->
<div id="appPage">
  <h1>EcoHero – Boas Ações</h1>
  <div id="userTree"></div>
  <p id="welcome"></p>
  <h2>Pontos: <span id="points"></span></h2>
  <div class="points-bar"><div class="points-fill" id="pointsBar">0%</div></div>

  <div class="menu">
    <button id="menuFood" class="active" onclick="showPage('food', this)">Alimentos</button>
    <button id="menuAnimals" onclick="showPage('animals', this)">Animais</button>
    <button id="menuEnv" onclick="showPage('environment', this)">Conscientização</button>
  </div>

  <div id="food" class="action-page" style="display:block;">
    <div class="action-card" onclick="registerAction('Doar Alimento',10,this)"><span class="emoji">🍎</span>Doar Alimento (+10)</div>
  </div>

  <div id="animals" class="action-page">
    <div class="action-card" onclick="registerAction('Passear Animais',15,this)"><span class="emoji">🐕</span>Passear Animais (+15)</div>
    <div class="action-card" onclick="registerAction('Doar Ração',15,this)"><span class="emoji">🍖</span>Doar Ração (+15)</div>
    <div class="action-card" onclick="registerAction('Adotar Cão',50,this)"><span class="emoji">🐶</span>Adotar Cão (+50)</div>
  </div>

  <div id="environment" class="action-page">
    <div class="action-card" onclick="registerAction('Limpeza Ambiental',10,this)"><span class="emoji">♻️</span>Limpeza Ambiental (+10)</div>
  </div>

  <h3>Recompensas:</h3>
  <div id="rewards"></div>
  <div id="badge"></div>
  <button id="logoutBtn">Logout</button>
</div>

<script>
const loginPage=document.getElementById('loginPage');
const appPage=document.getElementById('appPage');
const usernameInput=document.getElementById('username');
const loginBtn=document.getElementById('loginBtn');
const welcome=document.getElementById('welcome');
const pointsSpan=document.getElementById('points');
const pointsBar=document.getElementById('pointsBar');
const badgeDiv=document.getElementById('badge');
const rewardsDiv=document.getElementById('rewards');
const userTree=document.getElementById('userTree');
const pages=['food','animals','environment'];

let username=localStorage.getItem('username')||'';
let points=parseInt(localStorage.getItem('points'))||0;

const rewardsList=[
  {name:'5% Supermercado', points:50},
  {name:'10% Loja Orgânicos', points:100},
  {name:'Sacola Reutilizável', points:150},
  {name:'Workshop Sustentável', points:250},
  {name:'Badge: Amigo dos Animais', points:50, badge:'🐶'},
  {name:'Garrafa Reutilizável', points:150}
];

function showPage(id, btn){ pages.forEach(p=>document.getElementById(p).style.display='none'); document.getElementById(id).style.display='block'; document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }

function registerAction(name, pts, card){
  points+=pts; localStorage.setItem('points', points); updatePoints(); updateRewards();
  const floatSpan=document.createElement('span'); floatSpan.className='float-points'; floatSpan.innerText=`+${pts}`; card.appendChild(floatSpan);
  setTimeout(()=>{ floatSpan.remove(); },1000);
  userTree.style.transform = `scale(${1 + points/250})`;
}

function updatePoints(){ pointsSpan.innerText=points; let fill=Math.min(points,250)/250*100; pointsBar.style.width=fill+'%'; pointsBar.innerText=Math.floor(fill)+'%'; }
function updateRewards(){ rewardsDiv.innerHTML=''; rewardsList.forEach(r=>{ const canRedeem=points>=r.points; const btn=canRedeem?`<button onclick="redeemReward('${r.name}',${r.points},'${r.badge||''}')">Resgatar</button>`:`Faltam ${r.points-points} pontos`; rewardsDiv.innerHTML+=`<p><span>${r.name} (${r.points} pontos)</span> ${btn}</p>`; }); }

function redeemReward(name,cost,badge=''){ if(points>=cost){ points-=cost; localStorage.setItem('points',points); updatePoints(); updateRewards(); if(badge){ badgeDiv.innerText=`Badge desbloqueada! ${badge}`; badgeDiv.style.display='block'; setTimeout(()=>{ badgeDiv.style.display='none'; },3000); } } }

loginBtn.addEventListener('click',()=>{
  username=usernameInput.value.trim();
  if(!username){ alert('Digite seu nome!'); return;}
  localStorage.setItem('username',username);
  if(!localStorage.getItem('points')) localStorage.setItem('points',0);
  points=parseInt(localStorage.getItem('points'))||0;
  loginPage.style.display='none';
  appPage.style.display='block';
  welcome.innerText=`Bem-vindo(a), ${username}!`;
  showPage('food', document.getElementById('menuFood'));
  updatePoints();
  updateRewards();
});

document.getElementById('logoutBtn').addEventListener('click',()=>{ localStorage.removeItem('username'); loginPage.style.display='flex'; appPage.style.display='none'; });

if(username){ loginBtn.click(); }
</script>
</body>
</html>
